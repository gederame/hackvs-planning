<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning HackVS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F4F5F2;--surface:#FFFFFF;--surface-2:#EBEDE8;--ink:#161B22;--muted:#5D6570;--line:#DDE0D9;
  --accent:#C8102E;--accent-soft:#FBE3E6;--on-accent:#FFFFFF;
  --L1:#DCE8F7;--L2:#1D4E89;--A1:#DBEED6;--A2:#2C5A1D;--C1:#E6E2FB;--C2:#42309E;--M1:#F7E6C6;--M2:#744605;
  --G1:#D3EEE6;--G2:#0C5646;--S1:#F8DCD3;--S2:#862C13;--E1:#F7DAE5;--E2:#861D46;--P1:#E9EAE6;--P2:#5A5F66;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101318;--surface:#181C22;--surface-2:#20252C;--ink:#EDEFF2;--muted:#9AA2AC;--line:#2A3039;
  --accent:#FF5064;--accent-soft:#3A1A20;--on-accent:#12060A;
  --L1:#1C3352;--L2:#C2D9F6;--A1:#203D19;--A2:#CBE7C1;--C1:#2C2563;--C2:#D8D1FA;--M1:#4A3208;--M2:#F5DCAE;
  --G1:#0F3D33;--G2:#BAE6D9;--S1:#53220F;--S2:#F5CBBD;--E1:#52172E;--E2:#F4C6D7;--P1:#262A30;--P2:#A8AEB6}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101318;--surface:#181C22;--surface-2:#20252C;--ink:#EDEFF2;--muted:#9AA2AC;--line:#2A3039;
  --accent:#FF5064;--accent-soft:#3A1A20;--on-accent:#12060A;
  --L1:#1C3352;--L2:#C2D9F6;--A1:#203D19;--A2:#CBE7C1;--C1:#2C2563;--C2:#D8D1FA;--M1:#4A3208;--M2:#F5DCAE;
  --G1:#0F3D33;--G2:#BAE6D9;--S1:#53220F;--S2:#F5CBBD;--E1:#52172E;--E2:#F4C6D7;--P1:#262A30;--P2:#A8AEB6}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{display:grid;gap:18px}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .stars{display:flex;gap:3px;color:var(--accent)}
h1{font:800 clamp(34px,6vw,58px)/.95 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lede{margin:0;color:var(--muted);max-width:56ch}

/* controls */
.controls{display:grid;gap:14px}
.days{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;max-width:460px}
.days button{border:0;background:transparent;border-radius:10px;padding:10px 14px;text-align:left;display:grid;gap:2px;transition:background .15s}
.days button b{font:700 16px/1.1 var(--display)}
.days button span{font:500 12px/1 var(--mono);color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.08),0 0 0 1px var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.ghost:hover{border-color:var(--muted)}
.link{border:0;background:none;padding:4px 0;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* welcome screen */
.ask{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:var(--bg)}
.ask-in{width:100%;max-width:560px;display:grid;gap:28px}
.q{font:800 clamp(52px,14vw,112px)/.9 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.q em{font-style:normal;color:var(--accent)}
.askf{display:grid;gap:12px}
#ask[hidden],#app[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sel{position:relative}
.sel::after{content:"";position:absolute;right:20px;top:50%;width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{appearance:none;-webkit-appearance:none;width:100%;font:600 20px/1.2 var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:17px 52px 17px 18px;min-height:60px;cursor:pointer}
.sel select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 19px/1 var(--display);min-height:60px;padding:0 22px;transition:opacity .15s,transform .15s}
.go:disabled{opacity:.35;cursor:not-allowed}
.go span{display:inline-block;transition:transform .2s ease}
.go:not(:disabled):hover span{transform:translateX(4px)}

/* transition from the question to the planning */
.ask{transition:opacity .38s ease,transform .38s cubic-bezier(.5,0,.75,0)}
.ask.leaving{opacity:0;transform:translateY(-36px) scale(.97)}
.ask.leaving .go span{transform:translateX(18px);transition-duration:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.25)}100%{opacity:1;transform:none}}
#app.enter .controls,#app.enter .other,#app.enter .phead,#app.enter .tl>li,#app.enter .peek,#app.enter .help{animation:rise .55s cubic-bezier(.2,.75,.25,1) backwards;animation-delay:calc(var(--i,0)*70ms + 60ms)}
#app.enter .dot{animation:pop .45s cubic-bezier(.3,.8,.3,1.2) backwards;animation-delay:calc(var(--i,0)*70ms + 220ms)}
@media (prefers-reduced-motion:reduce){.ask,.ask.leaving{transition:none;transform:none}#app.enter *{animation:none!important}}
.go:not(:disabled):hover{transform:translateY(-1px)}

/* discreet "someone else" picker */
.peek{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding-top:6px}
.peek select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.other{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:14px}

/* role pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--body);padding:5px 10px;border-radius:6px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}

/* overview grid */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.gridwrap{display:grid;gap:12px}
thead th:first-child,tbody th{position:sticky;left:0;z-index:1;background:var(--surface)}
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:separate;border-spacing:3px;width:100%;min-width:900px;padding:6px}
th,td{padding:0}
thead th{font:600 13px/1 var(--body);padding:8px 4px 10px}
thead th button{border:0;background:none;padding:6px 8px;border-radius:8px;font-weight:600;width:100%}
thead th button:hover{background:var(--surface-2)}
tbody th{font:600 13px/1.25 var(--mono);color:var(--ink);text-align:left;padding:8px 10px 8px 6px;vertical-align:top;width:104px}
tbody th b{display:block;color:var(--ink);font-weight:700;font-size:14px;margin-bottom:3px}
tbody th i{font-style:normal;opacity:.75}
td.cell{border-radius:8px;vertical-align:top;height:40px}
td.cell span{display:block;padding:8px;font:600 12px/1.2 var(--body)}
td.cell small{display:block;font-weight:500;opacity:.8;margin-top:3px}
td.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
tr.now th b{color:var(--accent)}
tr.now th::after{content:"maintenant";display:block;margin-top:4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.hint{margin:0;font-size:13px;color:var(--muted)}

/* person view */
.person{display:grid;gap:18px}
.phead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.phead h2{font:800 clamp(28px,4.5vw,40px)/1 var(--display);margin:0;letter-spacing:-.01em}
.phead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl>li{display:grid;grid-template-columns:104px 22px minmax(0,1fr);gap:0 14px}
.time{font:700 15px/1.2 var(--mono);text-align:right;padding-top:14px;font-variant-numeric:tabular-nums}
.time small{display:block;font:600 14.5px/1.25 var(--mono);color:var(--ink);opacity:.72;margin-top:5px}
.time small::before{content:"à ";font-family:var(--body);font-weight:500}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl>li:first-child .rail::before{top:18px}
.tl>li:last-child .rail::before{bottom:calc(100% - 18px)}
.dot{position:relative;margin-top:14px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px currentColor;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-block:4px 14px;display:grid;gap:10px}
.card.pause{background:transparent;border-style:dashed}
.card.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.live{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:4px 7px;border-radius:4px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14.5px}
.tasks li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px}
.tasks li::before{content:"";width:6px;height:6px;margin-top:8px;border-radius:2px;background:var(--muted);opacity:.6}
.prog{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.prog>b{font:700 12px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prog ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.prog li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:14.5px}
.prog time{font:600 13.5px/1.5 var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:560px){.prog li{grid-template-columns:1fr;gap:0}}
.alert{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.alert svg{color:var(--accent);margin-top:2px}
.alert b{display:block;font-weight:600}
.alert ul{margin:4px 0 0;padding-left:18px}
.empty-day{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* contacts */
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.help h3{grid-column:1/-1;margin:0;font:700 18px/1.2 var(--display)}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.contact span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.contact b{font:700 17px/1.2 var(--display)}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel{font:600 16px/1.2 var(--mono);color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding-block:6px;user-select:all}


@media (max-width:700px){


}
@media (max-width:560px){
  .wrap{padding-inline:16px;padding-block:20px 40px;gap:20px}
  header{gap:10px}
  h1{font-size:36px}
  .lede{font-size:14.5px}
  .controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;gap:10px;border-bottom:1px solid var(--line)}
  .days{display:grid;max-width:none}
  .days button{padding:8px 12px;min-height:48px}
  .ask{padding:24px 16px}
  .ask-in{gap:24px}
  .go{width:100%}
  .peek select{font-size:16px;padding:8px 10px}
  .other{font-size:15px}
  .phead{padding-bottom:12px}
  .tl>li{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .time{text-align:left;padding-top:6px;display:flex;align-items:baseline;gap:8px;font-size:17px}
  .time small{display:inline;margin:0;font-size:16px}
  body{font-size:16px}
  .card{margin-block:6px 18px;padding:16px;gap:12px}
  .tasks{font-size:16px;gap:8px}
  .tasks li::before{margin-top:9px}
  .meta{font-size:14.5px}
  .pill{font-size:14px;padding:7px 12px}
  .phead h2{font-size:34px}
  .phead p{font-size:15px}
  .prog li{font-size:15.5px}
  .prog time{font-size:14.5px}
  .alert{font-size:15px}
  .hint{font-size:14.5px}
  table{min-width:820px}
  tbody th{width:80px;font-size:12.5px}
  tbody th b{font-size:14px}
  .days button b{font-size:18px}
  .days button span{font-size:13px}
  .help h3{font-size:19px}
  .contact span{font-size:12px}
  .contact b{font-size:19px}
  .tel{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <button type="button" class="ghost" id="cal"></button>
    </div>
    <div class="days" id="days"></div>
  </section>

  <main id="out"></main>

  <section class="help" aria-label="Contacts" style="--i:7">
    <h3>Un participant pose une question et tu n'as pas la réponse ?</h3>
    <div class="contact">
      <span>Challenges ou hackathon</span>
      <b>Emilie</b>

      <div class="phone" style="color:var(--muted);font-size:14px">Numéro à venir, je le note ici dès que je l'ai</div>
    </div>
  </section>
</div>

["16:00","17h (env.)","SBB, présentations","S S _ S O O O O O M"]],
t:{L:LOG,A:["Ouvert au public dès 9h45","Accueillir les visiteurs au desk de l'entrée","Leur présenter le hackathon et leur faire visiter, ils peuvent regarder les feuilles de pitch","Leur donner le flyer avec le QR code et les inviter à voter","Très important : les inviter à la partie officielle (RDV de l'innovation) à 14h, avec apéro à la fin"],C:["Accompagner les équipes","Les préparer au pitch","Rappeler les critères d'évaluation"],M:COM,S:["Présentations officielles (RDV de l'innovation) dès 14h","Soutien scène et logistique"],O:["Tout le monde est là","Présentations officielles (RDV de l'innovation) dès 14h"]}}};
const PROG=[["14:00","Gilles Florey et François Seppey souhaitent la bienvenue au public"],["14:05","Keynote d'ouverture par Natalie Sarrasin et Guillaume Tschupp"],["14:45","Aurélien et Antoine (et Léon ?) présentent le hackathon et la BTA"],["14:50","Présentation du jury"],["14:55 – 15:35","Pitch de la meilleure équipe de chaque challenge (4 pitchs)"],["15:30 – 16:00","Remise des prix, selon le timing"],["16:15","Apéro de remerciement"]];
Object.values(D).forEach(d=>d.s=d.s.map(x=>({a:x[0],b:x[1],l:x[2],c:x[3].split(" ").map(v=>v==="_"?"":v)})));
// a gap between two work slots counts as a break, so it shows as one continuous "Pause"
Object.values(D).forEach(d=>P.forEach((_,i)=>{const w=d.s.map(s=>!!s.c[i]&&s.c[i]!=="P"),a=w.indexOf(true),z=w.lastIndexOf(true);for(let k=a+1;k<z;k++)if(!d.s[k].c[i])d.s[k].c[i]="P"}));

const ICON=`<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 5.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1.2" fill="currentColor"/></svg>`;

function today(){const n=new Date(),p=v=>String(v).padStart(2,"0");return{iso:`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`,hm:`${p(n.getHours())}:${p(n.getMinutes())}`}}
function end(b){const m=b.match(/^(\d{1,2})[:h](\d{2})?/);return m?`${m[1].padStart(2,"0")}:${m[2]||"00"}`:"23:59"}
function isNow(dk,a,b){const t=today();return D[dk].iso===t.iso&&t.hm>=a&&t.hm<end(b)}

// view: "ask" (welcome question) or "app"; p: person shown (null = everyone's calendar); me: who the viewer said they are
let st={view:"ask",d:"sat",p:null,me:null};
try{const s=JSON.parse(localStorage.getItem("hackvs-planning")||"{}");if(D[s.d])st.d=s.d;if(P.includes(s.me))st.me=s.me}catch(e){}
if(today().iso===D.sun.iso)st.d="sun";else if(today().iso===D.sat.iso)st.d="sat";
function save(){try{localStorage.setItem("hackvs-planning",JSON.stringify({d:st.d,me:st.me}))}catch(e){}}
const CAL=`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 6.5h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const ME=`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 14.5c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

function bg(c){return c==="MG"?"linear-gradient(90deg,var(--M1),var(--G1))":`var(--${K[c]}1)`}
function fam(c){return c==="MG"?[R.M,R.G]:[R[c]]}
function pill(c){return `<span class="pill" style="background:${bg(c)};color:var(--${K[c]}2)">${R[c]}</span>`}
function blocks(p,dk){const d=D[dk],i=P.indexOf(p),o=[];d.s.forEach((s,k)=>{const c=s.c[i],l=o[o.length-1];if(c&&l&&l.c===c&&l.e===k-1){l.e=k;l.b=s.b}else if(c)o.push({c,st:k,e:k,a:s.a,b:s.b})});while(o.length&&o[0].c==="P")o.shift();while(o.length&&o[o.length-1].c==="P")o.pop();return o}

function overview(){
  const g=(s,i)=>s.c[i]==="P"?"":s.c[i]; // breaks stay blank in the grid
  const d=D[st.d],n=d.s.length,span=d.s.map(()=>P.map(()=>1));
  P.forEach((_,i)=>{let k=0;while(k<n){const c=g(d.s[k],i);let j=k;while(j+1<n&&g(d.s[j+1],i)===c)j++;span[k][i]=j-k+1;for(let m=k+1;m<=j;m++)span[m][i]=0;k=j+1}});
  const used=[...new Set(d.s.flatMap(s=>s.c.map((_,i)=>g(s,i))).filter(Boolean).map(c=>R[c]))];
  const legend=Object.keys(R).filter((c,ix,arr)=>used.includes(R[c])&&arr.findIndex(x=>R[x]===R[c])===ix).map(pill).join("");
  let h=`<div style="display:grid;gap:12px"><div><h2 style="font:800 clamp(26px,4vw,36px)/1.05 var(--display);margin:0 0 6px">Planning de tout le monde</h2><p class="hint">Touche un prénom pour voir ses consignes détaillées.</p></div><div class="gridwrap"><div class="legend">${legend}</div><div class="gridbox"><table><thead><tr><th></th>${P.map(p=>`<th><button type="button" data-p="${p}">${p}</button></th>`).join("")}</tr></thead><tbody>`;
  d.s.forEach((s,k)=>{
    h+=`<tr class="${isNow(st.d,s.a,s.b)?"now":""}"><th><b>${s.a}</b><i>à ${s.b}</i></th>`;
    P.forEach((_,i)=>{const r=span[k][i];if(!r)return;const c=g(s,i);
      h+=c?`<td class="cell" rowspan="${r}" style="background:${bg(c)};color:var(--${K[c]}2)"><span>${R[c]}${d.lr[c]?`<small>${d.lr[c]}</small>`:""}</span></td>`:`<td class="cell empty" rowspan="${r}"></td>`});
    h+="</tr>"});
  return h+`</tbody></table></div></div></div>`}

function person(p){
  const d=D[st.d],i=P.indexOf(p),bl=blocks(p,st.d);
  const work=bl.filter(b=>b.c!=="P");
  const mine=p===st.me;
  let h=`<div class="person">`;
  if(!mine)h+=`<div class="other" style="--i:1"><span>Tu regardes le planning de <b>${p}</b></span>${st.me?`<button type="button" class="link" data-p="${st.me}">Revenir au mien</button>`:""}</div>`;
  h+=`<div class="phead" style="--i:1"><div><h2>${mine?`Salut ${p}`:p}</h2><p>${d.n} ${d.dt}${work.length?` · de ${bl[0].a} à ${bl[bl.length-1].b}`:""}</p></div>${mine?`<button type="button" class="link" id="change">Pas toi ?</button>`:""}</div>`;
  const peek=`<div class="peek" style="--i:${bl.length+2}"><label for="peek">Voir le planning de</label><select id="peek"><option value="">quelqu'un d'autre…</option>${P.filter(q=>q!==p).map(q=>`<option>${q}</option>`).join("")}</select></div>`;
  if(!bl.length)return h+`<div class="empty-day">Pas de créneau ce jour-là.</div>${peek}</div>`;
  h+=`<ol class="tl">`+bl.map((b,n)=>{
    const s=d.s[b.st],k=K[b.c],now=d.s.slice(b.st,b.e+1).some(x=>isNow(st.d,x.a,x.b)),li=`<li style="--i:${n+2}">`;
    const left=`<div class="time">${b.a}<small>${b.b}</small></div><div class="rail"><span class="dot" style="color:var(--${k}2)"></span></div>`;
    if(b.c==="P"){let x=`<div class="card pause"><div class="top">${pill("P")}${now?'<span class="live">En cours</span>':""}</div>`;
      if(st.d==="sun"&&b.a==="12:00")x+=`<div class="alert">${ICON}<div><b>Toujours 2 personnes dans la salle</b>Pour accueillir les visiteurs. Organisation sur place entre nous.</div></div>`;
      return `${li}${left}${x}</div></li>`}
    const m=P.filter((q,j)=>j!==i&&s.c[j]&&fam(s.c[j]).some(r=>fam(b.c).includes(r))&&(d.lr[s.c[j]]||s.l)===(d.lr[b.c]||s.l));
    let tk=d.t[b.c]||[];if(st.d==="sun"&&b.c==="L"&&b.a==="09:00"&&!["Aurélien","Sam","Raf","Léon"].includes(p))tk=tk.filter(t=>t!=="Communiquer sur Slack");
    if(st.d==="sat"&&b.c==="L"&&b.a==="09:00")tk=tk.filter(t=>t!=="Accueillir les participants"&&t!=="Communiquer sur Slack");
    if(st.d==="sat"&&b.c==="L"&&b.a==="10:20")tk=["Garder la salle en ordre",...(["Aurélien","Sam","Raf","Léon"].includes(p)?["Communiquer sur Slack"]:[])];
    let x=`<div class="card${now?" now":""}"><div class="top">${pill(b.c)}${now?'<span class="live">En cours</span>':""}</div>`;
    x+=`<div class="meta"><span>Lieu <b>${d.lr[b.c]||s.l}</b></span>${m.length?`<span>Avec <b>${m.join(", ")}</b></span>`:""}</div>`;
    if(tk.length)x+=`<ul class="tasks">${tk.map(t=>`<li>${t}</li>`).join("")}</ul>`;
    if(st.d==="sat"&&b.c==="M"&&b.a==="09:30")x+=`<div class="prog"><b>Déroulé du lancement</b><ol>${[["09:30","Accueil des participants (kiosk et salle 2)"],["09:45","Mot de bienvenue d'Emilie / Antoine"],["Ensuite","Présentation des sponsors (10 min chacun) et de leur challenge"],["10:20","Participants répartis par challenge, début du coaching"]].map(([t,v])=>`<li><time>${t}</time><span>${v}</span></li>`).join("")}</ol></div>`;
    if(b.c==="O"||(st.d==="sun"&&b.c==="S"))x+=`<div class="prog"><b>Programme</b><ol>${PROG.map(([t,v])=>`<li><time>${t}</time><span>${v}</span></li>`).join("")}</ol></div>`;
    if(st.d==="sat"&&fam(b.c).includes(R.G)&&/fermeture/.test(b.b))x+=`<div class="alert">${ICON}<div><b>Équipe de clôture</b><ul><li>Faire sortir tout le monde à 21h</li><li>Garder les pitchs A3 des participants : soit les amener à la SBB, soit les garder en bas et les monter le lendemain</li></ul></div></div>`;
    return `${li}${left}${x}</div></li>`}).join("")+`</ol>${peek}</div>`;
  return h}

const $=id=>document.getElementById(id);
$("who").innerHTML=`<option value="" disabled selected>Choisis ton prénom</option>`+P.map(p=>`<option>${p}</option>`).join("");

function render(){
  const asking=st.view==="ask";
  $("ask").hidden=!asking;$("app").hidden=asking;
  $("ask").style.display=asking?"":"none";$("app").style.display=asking?"none":"";
  if(st.view==="ask"){$("who").value=st.me||"";$("go").disabled=!st.me;save();return}
  $("days").innerHTML=Object.entries(D).map(([k,d])=>`<button type="button" aria-pressed="${k===st.d}" data-d="${k}"><b>${d.n}</b><span>${d.dt}</span></button>`).join("");
  $("cal").innerHTML=st.p||!st.me?`${CAL}Planning de tout le monde`:`${ME}Mon planning`;
  $("out").innerHTML=st.p?person(st.p):overview();
  save()}
function go(p){st.view="app";st.p=p;render();window.scrollTo(0,0)}

$("who").addEventListener("change",()=>{$("go").disabled=!$("who").value});
$("askf").addEventListener("submit",e=>{
  e.preventDefault();const v=$("who").value;if(!v||$("ask").classList.contains("leaving"))return;st.me=v;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){go(v);return}
  $("ask").classList.add("leaving");
  setTimeout(()=>{$("app").classList.add("enter");go(v);$("ask").classList.remove("leaving");setTimeout(()=>$("app").classList.remove("enter"),1800)},380)});
document.addEventListener("change",e=>{if(e.target.id==="peek"&&e.target.value)go(e.target.value)});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.d){st.d=b.dataset.d;render()}
  else if("p" in b.dataset)go(b.dataset.p||null);
  else if(b.id==="cal")go(st.p||!st.me?null:st.me);
  else if(b.id==="change"){st.view="ask";st.me=null;render();window.scrollTo(0,0)}
});
render();
</script>
</body>
</html>
